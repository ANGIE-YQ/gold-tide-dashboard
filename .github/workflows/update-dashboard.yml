name: Update Gold Tide Dashboard

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild Features
        run: python gold_tide_en_v.py

      - name: Train Models
        run: python train_multimodel.py

      - name: Build Dashboard Data
        run: python build_dashboard_data.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/dashboard_data.json \
                  gold_AU0_daily.csv gold_features.csv gold_features_enhanced.csv \
                  gold_tide_calibrated_model.pkl \
                  gold_tide_model_v1_*.pkl gold_tide_model_v2_*.pkl gold_tide_model_v3_*.pkl \
                  model_comparison_results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh dashboard $(date +'%Y-%m-%d')"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
